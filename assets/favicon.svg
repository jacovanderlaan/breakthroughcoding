<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Breakthrough Coding</title>
  <!--
    Angle brackets already mean "code" to everyone who would read this site.
    What makes them ours is the gold: in real code the brackets wrap markup;
    here they hold the diamond — the thing the model generates. Brackets are
    the syntax, the diamond is what the syntax produces.

    Geometry source of truth:
    W:/data/products/breakthroughcoding/brand/logo/

    Favicon build: stroke 26 rather than 16, diamond 44 rather than 30, and the
    brackets pushed wider apart. At 16 px the canonical weights collapse into
    one dark smudge.
  -->
  <rect width="200" height="200" rx="44" fill="#0f172a"/>
  <g fill="none" stroke="#4a9d76" stroke-width="24"
     stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 76 48 L 36 100 L 76 152" />
    <path d="M 124 48 L 164 100 L 124 152" />
  </g>
  <rect x="82" y="82" width="36" height="36" fill="#b88a1b"
        transform="rotate(45 100 100)" />
</svg>
